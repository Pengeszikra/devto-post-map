document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t game in under 2 hours in 2020, then the Solitaire challenge entry in 2024.'],\n  ['termold', 'term', 'i', 'Same title four years apart: the 2022 bash tips and the 2026 terminal manifesto.'],\n  ['trap', 'ruststart', 'i', 'Your first Rust posts, a month apart in 2020.'],\n  ['ruststart', 'rust', 'i', 'Rust from 2020 hot-reloading experiments to the 2026 Rustroke WASM win.'],\n].map(([a, b, k, reason]) => ({ a, b, k, reason }));\n\nconst READ = new Set(['va', 'mdjs', 'vov', 'slop', 'snccg', 'lib', 'eye', 'sn11', 'dnp', 'pipe1']);\nconst SUMMARY = {\n  va: 'A career memoir that runs from Z80 assembly through Flash and graphic design to web development and life in an 1859 mudbrick house. It defines the “Vibe Archeologist”: someone who digs up old ideas and code and revives them with AI. It also lists the challenge wins and the projects planned next.',\n  sn1: 'Issue 0001 of a sarcastic, pre-apocalyptic IT news column. It collects AI and tech headlines and comments on them in a doomsday tone. Readers are invited to add their own news in the comments.',\n  sn2: 'The launch announcement of the Singularity News channel on dev.to. It explains the idea: a community-fed, sarcastic news feed about the road to the singularity. It sets the tone for the numbered issues that follow.',\n  sn10: 'Issue 0010 of the feed, featuring flying Teslas and bunker locations. Each item is a real tech story told as a sign of the coming end. As always, readers can add news in the comments.',\n  sn11: 'Issue 0011: robot microducks, a vibe-coded 3ds Max, and a company where everyone just presses ENTER. It summarises Harari’s Oxford lecture on bureaucracy as the oxygen of AI. It ends with the flying Roadster and its price tag.',\n  snccg: 'A Hacktoberfest week-4 entry: a collectible card game set in the Singularity News world. It reuses the Flogon card system and CSS-3D desk, is built with pure HTML and no build step, and lets you interview every card through Gemma 4. The author credits the Vibe Archeologist approach and slop coding for the speed.',\n  alien: 'A DEV game-challenge entry: a sci-fi solitaire card game for the browser. It is the field test of the JSDoc-typed React state module from the npm quest. It is part 3 of the react-to-no-framework series.',\n  sdd: 'Introduces Story Driven Development: write the story first and let the code follow it. It uses a game world as the example. It is the step just before Flogon Galaxy in the series.',\n  fg: 'A short showcase of Flogon Galaxy, a browser game set in the Flogon sci-fi world. It comes with a video demo. The full technical story follows in “The Voice of Void”.',\n  vov: 'The full hackathon write-up of the Flogon game, built with JSDoc and no compile step after an 8 GB React build failed. It covers the CSS-3D card desk, the soundtrack and a minimal hand-made framework. It argues that plain JavaScript can be great again.',\n  vis: 'The Flogon saga continues as an AI-generated sci-fi movie. It shows how much visuals add to a story. It walks through the tools and the process behind the clips.',\n  mmo: 'Plans the architecture of a JavaScript MMORPG. It discusses state, networking and how React fits in. It reads as the multiplayer follow-up to the Flogon games.',\n  content: 'An experiment from early 2023: using ChatGPT to create a complex fantasy story and the program content around it. It shows the prompts and what came out of them. It is one of your first posts on LLM storytelling.',\n  tartalom: 'The Hungarian version of the ChatGPT content-creation article. It retells how ChatGPT helped build a fantasy story and program content. It was published a day after the English version.',\n  truerpg: 'A long 2023 session where ChatGPT 4 runs a role-playing game and DALL-E 3 illustrates it. It shows how far an LLM can act as Game Master. It is the origin of the LLM RPG tests that come later.',\n  gaz: 'An entry for the Gemini writing challenge: a noble intrigue told one line at a time. It shows what Gemini does with very tight constraints. It is an early example of your single-line motif.',\n  mind: 'A DEV Weekend Challenge (Earth Day) entry built around a thinking game. It asks how games can train or test a mind. It ties the challenge theme to AI.',\n  rpg: 'A 2026 benchmark: several LLMs are asked to run the same role-playing game. It compares how well they keep the world and the rules consistent. It repeats the Game Master test you have used since 2023.',\n  bell: 'A story that came out of an LLM role-play session. The Game Master test is turned into readable fiction. It shows what a long session with a model can produce.',\n  eye: 'UMGD stands for Under Meeting Game Development: a 3D spaceship game prompted with Copilot CLI and Claude during a three-hour meeting. Copilot used your TS + |> fork and the pipeline operator extensively. The main claim is that new models are showing something like spatial understanding.',\n  mdjs: 'An April Fools entry: MorDorJS, a “framework” whose only rule is a maximum line length of 1. It satirises AI-readable code by making code that AI struggles to read. It is set in the Mordor office, with the Nazgûl Manager and the coffee machine.',\n  mcm: 'The Mordor office coffee machine as a joke-driven dev project. It parodies enterprise productivity tools. It shares its world with MorDorJS.',\n  cv: 'Rejects long CVs in favour of one punchy line. It shows your own single-line CV and asks readers for theirs. It continues the single-line motif.',\n  stolen: 'Asks whether AI models trained on your published content are stealing it. It weighs the open-source spirit against authorship. You later brought it up when talking about AI-made art in Flogon.',\n  oscar: 'A short piece about awards and credit for AI-made work. It asks who deserves the prize when AI does the making. It links AI to design and diversity.',\n  slop: 'Defends “slop coding” as a fast way to dig up and finish old ideas. Its example, After Flash, brings back your old Flash and Wacom drawing workflow as a PWA. It cites the Vibe Archeologist memoir as the method.',\n  dnp: 'Starts from Harari’s Oxford lecture on bureaucracy as the oxygen of AI. It asks whether all our videos about how AI could defeat us are writing the instruction manual for it. It ends with a question: are we preparing to survive superintelligence, or preparing it to survive us?',\n  lib: 'Argues that AI has removed technology barriers: you can now pick any language for the job, so choosing the stack is the new responsibility. It asks you to care for what you build with craftsmanship. It revisits the Chuck Norris TODO list as a deliberately “wrong” no-build app that foreshadowed the mordor project.',\n  trap: 'An early Rust note about a pitfall with fold. It shows the surprising case and the fix. It is one of your first Rust posts.',\n  ruststart: 'Notes from starting Rust, focused on setting up hot reloading. It shows the tooling for a fast edit-and-run loop. It is the beginning of the Rust line that leads to Rustroke.',\n  termold: 'Bash tips for everyday JavaScript work in the terminal. It argues that the shell saves time. It shares its title with the 2026 post written four years later.',\n  rust: 'A GitHub Copilot CLI Challenge entry, and a winner: a minimal drawing app in Rust compiled to WASM. It shows how the CLI agent helped build it. It is the win the Vibe Archeologist memoir opens with.',\n  term: 'A Hacktoberfest ’26 weekend entry that makes the case for the terminal. It is aimed at beginners afraid of the command line. It sits alongside the CLI-first Rust and WASM work.',\n  hexaw: 'Presents HEXAW, a lazy text format for WebAssembly meant to replace WAT. It looks like assembly but compiles to WASM. It appears to be the language promised in the Vibe Archeologist memoir.',\n  nodisl: 'A short ESLint note on the no-undef rule. It shows how the rule catches a whole class of JavaScript mistakes. It is about catching errors without a compiler.',\n  reduce: 'A playful, L and JS. It is the turning point of the series.',\n  how: 'Part 5: a video of your everyday coding style with pure web tools. It shows the editor, the files and the workflow. It is the “pure web” approach in practice.',\n  chuck: 'Part 6: a deliberately odd TODO list where one input edits the whole list. It runs on a single signal function, with no build and code minified by hand. You revisit it in “Liberation from Tech Dep(b)to” in 2026.',\n  wan: 'Part 7: a tiny “wannabe” framework distilled from the no-framework experiments. It shows how little is needed for reactive UI. It is the step before JSDoc Evangelism.',\n  jsdoc: 'Part 8: makes the case for JSDoc over TypeScript compilation. You get types and editor help with no build step. Voice of Void later names it a pillar of its build.',\n  wheel: 'Part 12, the series finale: why reinvent the wheel with plain HTML, JS and Tailwind. It answers the usual objection to no-framework work. It closes the react-to-no-framework arc.',\n};\nconst MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nconst tOf = s => { const m = /^(\\w{3})(?: (\\d+),)? (\\d{4})$/.exec(s); if (!m) return null; const mi = MONTHS.indexOf(m[1]); return +m[3] + (mi + (m[2] ? (+m[2] - 1) / 31 : 0.5)) / 12; };\nconst T0 = 2020 + 6.5 / 12, T1 = 2026 + 11.5 / 12;\nconst pctOf = t => Math.max(0, Math.min(100, (t - T0) / (T1 - T0) * 100));\nconst POST_BY = Object.fromEntries(POSTS.map(p => [p.id, p]));\nconst HUB_BY = Object.fromEntries(HUBS.map(h => [h.id, h]));\n\nconst POS = {}; const HPOS = {};\n['R', 'L'].forEach(side => {\n  const hs = HUBS.filter(h => h.side === side);\n  const n = hs.reduce((a, h) => a + POSTS.filter(p => p.hub === h.id).length, 0);\n  const total = n * PITCH - (PITCH - LH) + (hs.length - 1) * GG;\n  let y = (H - total) / 2;\n  hs.forEach(h => {\n    const ps = POSTS.filter(p => p.hub === h.id);\n    const y0 = y;\n    ps.forEach(p => { POS[p.id] = { x: side === 'L' ? CX - 440 - LW : CX + 440, y, nst GEOM = LINKS.map(linkGeom);\nconst TREE = [];\nHUBS.forEach(h => {\n  TREE.push({ hub: h.id, leaf: null, g: hcurve(rootEdge(h.side), hubIn(h.id)) });\n  POSTS.filter(p => p.hub === h.id).forEach(p => TREE.push({ hub: h.id, leaf: p.id, g: hcurve(hubOut(h.id), leafIn(p.id)) }));\n});\n\nclass Component extends DCLogic {\n  state = { sel: 'va', mw: 1200, mh: 800, zoom: null, panel: true, zen: false, toast: '' };\n  flash = msg => { clearTimeout(this.tt); this.setState({ toast: msg }); this.tt = setTimeout(() => this.setState({ toast: '' }), 1800); };\n  mapRef = React.createRef();\n\n  componentDidMount() {\n    const attach = () => {\n      const el = this.mapRef.current;\n      if (!el) return setTimeout(attach, 50);\n      const upd = () => this.setState({ mw: el.clientWidth, mh: el.clientHeight });\n      upd();\n      this.ro = new ResizeObserver(upd);\n      this.ro.observe(el);\n    };\n    attach();\n    const DIRS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };\n    const centerOf = id => id === 'va' ? { x: CX, y: CY } : HPOS[id] ? { x: HPOS[id].cx, y: HPOS[id].cy } : { x: POS[id].x + LW / 2, y: POS[id].cy };\n    const ALL = ['va', ...HUBS.map(h => h.id), ...POSTS.filter(p => p.id !== 'va').map(p => p.id)];\n    this.onKey = e => {\n      const t = e.target;\n      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;\n      if (e.key === 'Escape') return this.setState({ sel: null });\n      if (e.ctrlKey || e.metaKey || e.altKey) return;\n      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;\n      const post = POST_BY[this.state.sel];\n      const link = post ? `https://dev.to/pengeszikra/${post.slug}` : null;\n      if (k === '+' || k === '=' || k === '-' || k === 'f') {\n        e.preventDefault();\n        const fit = Math.max(0.2, Math.min((this.state.mw - 48) / W, (this.state.mh - 48) / H));\n        const s = this.state.zoom ?? fit;\n        const zoom = k === 'f .reveal = p => {\n      const el = this.mapRef.current;\n      if (!el) return;\n      const s = this.state.zoom ?? Math.max(0.2, Math.min((this.state.mw - 48) / W, (this.state.mh - 48) / H));\n      const inner = el.firstElementChild;\n      const ox = inner ? inner.offsetLeft : 24, oy = inner ? inner.offsetTop : 24;\n      el.scrollTo({ left: ox + p.x * s - el.clientWidth / 2, top: oy + p.y * s - el.clientHeight / 2, behavior: 'smooth' });\n    };\n    window.addEventListener('keydown', this.onKey);\n  }\n  componentWillUnmount() {\n    this.ro && this.ro.disconnect();\n    window.removeEventListener('keydown', this.onKey);\n  }\n\n  pick = id => e => { e && e.stopPropagation(); this.setState({ sel: id }); };\n\n  renderVals() {\n    const showInf = this.props.showInferred ?? true;\n    const showTree = this.props.showBranches ?? true;\n    const idleLinks = this.props.idleLinks ?? true;\n    const { sel, mw, mh, zoom } = this.state;\n    const links = LINKS.map((l, i) => ({ ...l, i })).filter(l => showInf || l.k === 'e');\n    const isHubSel = sel && !!HUB_BY[sel];\n    const isPostSel = sel && !isHubSel;\n\n    const linkCount = {};\n    links.forEach(l => { linkCount[l.a] = (linkCount[l.a] || 0) + 1; linkCount[l.b] = (linkCount[l.b] || 0) + 1; });\n\n    let focus = null;\n    if (sel) {\n      focus = new Set([sel]);\n      if (isPostSel) {\n        links.forEach(l => { if (l.a === sel) focus.add(l.b); if (l.b === sel) focus.add(l.a); });\n        if (sel !== 'va') focus.add(POST_BY[sel].hub);\n      } else {\n        POSTS.filter(p => p.hub === sel).forEach(p => focus.add(p.id));\n        focus.add('va');\n        links.forEach(l => { if (l.a === sel) focus.add(l.b); if (l.b === sel) focus.add(l.a); });\n      }\n    }\n    const lit = id => !focus || focus.has(id);\n    const incident = l => isPostSel ? (l.a === sel || l.b === sel)\n      : isHubSel ? (l.a === sel || l.b === sel || hubOf(l.a) === sel || hubOf(l.b) === sel) : false;\n\n    // connections for  POS[p.id], on = sel === p.id;\n      return {\n        id: p.id, label: p.label, x: pos.x, y: pos.y,\n        meta: p.r != null ? `${p.date} · ♡ ${p.r}` : p.date,\n        color: col(h.h), linkLabel: lc(linkCount[p.id]),\n        dir: pos.side === 'L' ? 'row-reverse' : 'row', align: pos.side === 'L' ? 'flex-end' : 'flex-start',\n        bg: on ? 'oklch(0.27 0.014 70)' : 'oklch(0.215 0.01 70)',\n        border: on ? col(h.h) : col(h.h, 0.32),\n        shadow: on ? `0 0 0 4px ${col(h.h, 0.22)}` : 'none',\n        opacity: lit(p.id) ? 1 : 0.26,\n        onClick: this.pick(p.id),\n      };\n    });\n    const postsIn = id => POSTS.filter(p => p.hub === id);\n    const hubs = HUBS.map(h => ({\n      name: h.name, color: col(h.h), count: `${postsIn(h.id).length} posts`,\n      x: HPOS[h.id].cx - 90, y: HPOS[h.id].cy - 25,\n      opacity: lit(h.id) ? 1 : 0.3,\n      shadow: sel === h.id ? `0 0 0 4px ${col(h.h, 0.25)}` : 'none',\n      onClick: this.pick(h.id),\n    }));\n\n    const fit = Math.max(0.2, Math.min((mw - 48) / W, (mh - 48) / H));\n    const s = zoom ?? fit;\n\n    const vals = {\n      ...(() => {\n        const rel = new Set();\n        if (isPostSel) links.forEach(l => { if (l.a === sel) rel.add(l.b); if (l.b === sel) rel.add(l.a); });\n        const tlTicks = POSTS.map(p => {\n          const on = sel === p.id || (isHubSel && p.hub === sel);\n          const near = rel.has(p.id);\n          return { left: pctOf(tOf(p.date)), color: on ? colorOf(p.id) : near ? colorOf(p.id) : 'oklch(0.6 0.015 75)', op: !sel ? 0.55 : on ? 1 : near ? 0.75 : 0.22, title: `${p.date} · ${p.title}`, onClick: this.pick(p.id) };\n        });\n        const tlYears = [2021, 2022, 2023, 2024, 2025, 2026].map(y => ({ left: pctOf(y), label: String(y) }));\n        let o = { tlBandL: 0, tlBandW: 100, tlBandOp: 0, tlMarkL: 50, tlMarkOp: 0, tlLabelL: 50, tlLabelOp: 0, tlLabel: '', tlColor: INK, tlBandBg: 'transparent' };\n        if (isPostSel) {\n          const p = POST_BY[sel], x = pct
